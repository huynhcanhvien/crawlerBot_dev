version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: crawlerx_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-twitter_crawler_db}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - crawlerx_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: crawlerx_api
    restart: unless-stopped
    ports:
      - "5003:5003"  # Fixed port mapping to match the API
    env_file:
      - .env
    environment:
      # MongoDB connection
      MONGO_HOST: mongo  # Use service name for internal networking
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASS: ${MONGO_PASS:-admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-twitter_crawler_db}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: ${LOG_FILE:-logs/app.log}
      # Python
      PYTHONUNBUFFERED: 1
      # Timezone (default UTC)
      TZ: ${TZ:-UTC}
    volumes:
      - ./logs:/app/logs
      - ./scheduler_config.json:/app/scheduler_config.json
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - crawlerx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  crawlerx_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local