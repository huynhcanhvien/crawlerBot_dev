version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: crawlerx_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"  # Only bind to localhost for security
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - crawlerx_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  app:
    image: crawlerx:latest  # Use pre-built image in production
    container_name: crawlerx_api
    restart: always
    ports:
      - "127.0.0.1:5003:5003"  # Only bind to localhost, use reverse proxy
    env_file:
      - .env.prod  # Use production env file
    environment:
      # MongoDB connection
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      # Production settings
      FLASK_ENV: production
      LOG_LEVEL: WARNING
      # Python
      PYTHONUNBUFFERED: 1
    volumes:
      - ./logs:/app/logs:rw
      - ./scheduler_config.json:/app/scheduler_config.json:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - crawlerx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: crawlerx_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - crawlerx_network

networks:
  crawlerx_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local